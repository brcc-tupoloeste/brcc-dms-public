<!DOCTYPE html>
<html lang="en">

<head>

  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>
    BRCC-DMS Approval Center
  </title>


  <style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    :root {

      --primary: #166534;
      --primary-dark: #14532d;
      --primary-light: #dcfce7;

      --accent: #f59e0b;

      --danger: #dc2626;
      --danger-dark: #b91c1c;

      --success: #16a34a;

      --bg: #f1f5f9;

      --text: #1e293b;
      --muted: #64748b;

      --border: #e2e8f0;

      --white: #ffffff;

    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        var(--bg);

      color:
        var(--text);

    }


    button,
    input,
    textarea {

      font-family:
        inherit;

    }


    /* =========================================================
       APP CONTAINER
    ========================================================= */

    .app {

      width: 100%;

      max-width: 620px;

      margin: 0 auto;

      min-height: 100vh;

      background:
        #f8fafc;

      box-shadow:
        0 0 30px
        rgba(0,0,0,.08);

    }


    /* =========================================================
       OFFICIAL HEADER
    ========================================================= */

    .header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        linear-gradient(
          135deg,
          #14532d,
          #166534,
          #15803d
        );

      color:
        white;

      box-shadow:
        0 3px 14px
        rgba(0,0,0,.20);

    }


    .header-top {

      display: flex;

      align-items: center;

      padding:
        14px 16px 12px;

      gap: 12px;

    }


    .barangay-logo {

      width: 52px;

      height: 52px;

      border-radius: 50%;

      background:
        white;

      padding: 3px;

      object-fit: cover;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.25);

      flex-shrink: 0;

    }


    .header-info {

      flex: 1;

      min-width: 0;

    }


    .barangay-name {

      font-size: 18px;

      font-weight: 800;

      line-height: 1.2;

      letter-spacing: .2px;

    }


    .municipality {

      font-size: 11px;

      margin-top: 3px;

      opacity: .88;

    }


    .system-title {

      padding:
        9px 16px;

      background:
        rgba(0,0,0,.16);

      border-top:
        1px solid
        rgba(255,255,255,.12);

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

    }


    .system-title-left {

      display: flex;

      align-items: center;

      gap: 8px;

    }


    .system-title strong {

      font-size: 13px;

      letter-spacing: .2px;

    }


    .system-title span {

      font-size: 10px;

      opacity: .82;

    }


    .secure-badge {

      font-size: 10px;

      padding:
        4px 8px;

      border-radius: 20px;

      background:
        rgba(255,255,255,.15);

      border:
        1px solid
        rgba(255,255,255,.18);

      white-space: nowrap;

    }


    /* =========================================================
       CONTENT
    ========================================================= */

    .content {

      padding:
        16px;

      min-height:
        calc(100vh - 125px);

    }


    /* =========================================================
       LOGIN SCREEN
    ========================================================= */

    .login-screen {

      min-height:
        calc(100vh - 160px);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .login-card {

      width: 100%;

      background:
        white;

      border-radius:
        20px;

      overflow: hidden;

      box-shadow:
        0 10px 35px
        rgba(15,23,42,.10);

      border:
        1px solid
        var(--border);

    }


    .login-banner {

      padding:
        24px 20px 20px;

      text-align: center;

      background:
        linear-gradient(
          180deg,
          #f0fdf4,
          #ffffff
        );

      border-bottom:
        1px solid
        #dcfce7;

    }


    .login-icon {

      width: 70px;

      height: 70px;

      margin:
        0 auto 14px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      background:
        var(--primary-light);

      border:
        5px solid white;

      box-shadow:
        0 4px 14px
        rgba(22,101,52,.15);

    }


    .login-banner h2 {

      margin:
        0;

      font-size:
        22px;

      color:
        #14532d;

    }


    .login-banner p {

      margin:
        7px 0 0;

      font-size:
        13px;

      color:
        var(--muted);

      line-height:
        1.5;

    }


    .login-form {

      padding:
        22px;

    }


    .security-note {

      display: flex;

      gap: 9px;

      align-items: flex-start;

      padding:
        11px;

      margin-bottom:
        18px;

      border-radius:
        10px;

      background:
        #fffbeb;

      border:
        1px solid
        #fde68a;

      font-size:
        11px;

      color:
        #92400e;

      line-height:
        1.45;

    }


    /* =========================================================
       FORM
    ========================================================= */

    label {

      display: block;

      margin-bottom:
        7px;

      font-size:
        12px;

      font-weight:
        700;

      color:
        #334155;

      text-transform:
        uppercase;

      letter-spacing:
        .3px;

    }


    input,
    textarea {

      width: 100%;

      border:
        1px solid
        #cbd5e1;

      border-radius:
        11px;

      padding:
        14px;

      font-size:
        16px;

      outline:
        none;

      background:
        white;

      transition:
        .15s ease;

    }


    input:focus,
    textarea:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(22,101,52,.12);

    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    button {

      border: none;

      cursor: pointer;

      font-size:
        14px;

      font-weight:
        700;

      border-radius:
        10px;

      padding:
        13px 15px;

      transition:
        .15s ease;

    }


    button:active {

      transform:
        scale(.98);

    }


    .btn-primary {

      width: 100%;

      margin-top:
        16px;

      background:
        linear-gradient(
          135deg,
          #15803d,
          #166534
        );

      color:
        white;

      box-shadow:
        0 4px 10px
        rgba(22,101,52,.20);

    }


    .btn-primary:hover {

      background:
        #14532d;

    }


    .btn-refresh {

      background:
        white;

      color:
        var(--primary);

      border:
        1px solid
        #bbf7d0;

      padding:
        9px 12px;

      font-size:
        12px;

    }


    .btn-logout {

      background:
        #fee2e2;

      color:
        #b91c1c;

      border:
        1px solid
        #fecaca;

      padding:
        8px 10px;

      font-size:
        11px;

    }


    /* =========================================================
       DASHBOARD
    ========================================================= */

    .dashboard-top {

      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      margin-bottom:
        16px;

      gap: 10px;

    }


    .dashboard-title {

      margin: 0;

      font-size:
        20px;

      color:
        #1e293b;

    }


    .dashboard-subtitle {

      margin:
        4px 0 0;

      font-size:
        12px;

      color:
        var(--muted);

    }


    .dashboard-actions {

      display: flex;

      gap: 7px;

      align-items: center;

    }


    .request-count {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        5px;

      margin-top:
        9px;

      font-size:
        11px;

      background:
        #dcfce7;

      color:
        #166534;

      padding:
        6px 11px;

      border-radius:
        20px;

      font-weight:
        700;

    }


    /* =========================================================
       REQUEST CARD
    ========================================================= */

    .request-card {

      background:
        white;

      border-radius:
        15px;

      margin-bottom:
        15px;

      overflow:
        hidden;

      box-shadow:
        0 4px 15px
        rgba(15,23,42,.07);

      border:
        1px solid
        var(--border);

    }


    .request-card-header {

      padding:
        14px 15px;

      background:
        linear-gradient(
          90deg,
          #f0fdf4,
          #ffffff
        );

      border-bottom:
        1px solid
        #e5e7eb;

    }


    .request-id {

      display:
        inline-block;

      font-size:
        10px;

      color:
        #64748b;

      background:
        white;

      border:
        1px solid
        #e2e8f0;

      padding:
        4px 8px;

      border-radius:
        20px;

      margin-bottom:
        7px;

    }


    .dog-name {

      font-size:
        19px;

      font-weight:
        800;

      color:
        #14532d;

    }


    .request-card-body {

      padding:
        15px;

    }


    .info-row {

      margin-bottom:
        13px;

    }


    .info-label {

      display: block;

      font-size:
        10px;

      font-weight:
        800;

      text-transform:
        uppercase;

      color:
        #94a3b8;

      letter-spacing:
        .5px;

      margin-bottom:
        4px;

    }


    .info-value {

      font-size:
        14px;

      color:
        #334155;

      word-break:
        break-word;

      line-height:
        1.45;

    }


    .update-box {

      background:
        #fffbeb;

      border:
        1px solid
        #fde68a;

      border-left:
        4px solid
        #f59e0b;

      padding:
        12px;

      border-radius:
        9px;

      margin-top:
        8px;

    }


    .update-box .info-value {

      font-weight:
        600;

    }


    /* =========================================================
       ACTION BUTTONS
    ========================================================= */

    .actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      padding:
        13px 15px;

      border-top:
        1px solid
        #e5e7eb;

      background:
        #fafafa;

    }


    .btn-approve {

      background:
        #16a34a;

      color:
        white;

    }


    .btn-approve:hover {

      background:
        #15803d;

    }


    .btn-reject {

      background:
        #dc2626;

      color:
        white;

    }


    .btn-reject:hover {

      background:
        #b91c1c;

    }


    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty {

      text-align:
        center;

      padding:
        55px 20px;

      color:
        var(--muted);

      background:
        white;

      border-radius:
        16px;

      border:
        1px solid
        var(--border);

    }


    .empty-icon {

      width:
        70px;

      height:
        70px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      margin:
        0 auto 14px;

      font-size:
        32px;

      border-radius:
        50%;

      color:
        #15803d;

      background:
        #dcfce7;

    }


    .empty h3 {

      margin:
        0 0 7px;

      color:
        #334155;

    }


    .empty p {

      margin: 0;

      font-size:
        13px;

    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {

      text-align:
        center;

      padding:
        70px 20px;

      color:
        var(--muted);

    }


    .spinner {

      width:
        38px;

      height:
        38px;

      border:
        4px solid
        #dcfce7;

      border-top-color:
        #166534;

      border-radius:
        50%;

      margin:
        0 auto 15px;

      animation:
        spin 1s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =========================================================
       MODAL
    ========================================================= */

    .modal-overlay {

      display:
        none;

      position:
        fixed;

      inset:
        0;

      z-index:
        1000;

      background:
        rgba(15,23,42,.60);

      padding:
        20px;

      align-items:
        center;

      justify-content:
        center;

    }


    .modal {

      width:
        100%;

      max-width:
        420px;

      background:
        white;

      border-radius:
        18px;

      padding:
        22px;

      max-height:
        90vh;

      overflow-y:
        auto;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);

    }


    .modal h3 {

      margin:
        0 0 10px;

      font-size:
        20px;

      color:
        #1e293b;

    }


    .modal p {

      font-size:
        13px;

      line-height:
        1.5;

      color:
        #64748b;

    }


    .modal-actions {

      display:
        flex;

      gap:
        10px;

      margin-top:
        18px;

    }


    .modal-actions button {

      flex: 1;

    }


    .btn-cancel {

      background:
        #e2e8f0;

      color:
        #475569;

    }


    /* =========================================================
       TOAST
    ========================================================= */

    .toast {

      position:
        fixed;

      bottom:
        20px;

      left:
        50%;

      transform:
        translateX(-50%);

      width:
        calc(100% - 32px);

      max-width:
        500px;

      padding:
        14px 18px;

      border-radius:
        12px;

      color:
        white;

      font-size:
        13px;

      font-weight:
        700;

      display:
        none;

      z-index:
        2000;

      text-align:
        center;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);

    }


    .toast.success {

      background:
        #16a34a;

    }


    .toast.error {

      background:
        #dc2626;

    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {

      text-align:
        center;

      padding:
        15px;

      font-size:
        10px;

      color:
        #94a3b8;

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 480px) {

      .content {

        padding:
          12px;

      }

      .barangay-name {

        font-size:
          16px;

      }

      .dashboard-title {

        font-size:
          18px;

      }

      .dashboard-actions {

        flex-direction:
          column;

        align-items:
          stretch;

      }

      .btn-refresh,
      .btn-logout {

        width:
          100%;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ======================================================
       OFFICIAL HEADER
  ======================================================= -->

  <header class="header">

    <div class="header-top">

      <img
        src="barangay-logo.png"
        class="barangay-logo"
        alt="Barangay Tupol Oeste Logo"
      >


      <div class="header-info">

        <div class="barangay-name">
          Barangay Tupol Oeste
        </div>

        <div class="municipality">
          Municipality of Cabatuan, Province of Iloilo
        </div>

      </div>

    </div>


    <div class="system-title">

      <div class="system-title-left">

        <span>🐕</span>

        <div>

          <strong>
            BRCC-DMS Approval Center
          </strong>

          <br>

          <span>
            Mobile Registry Update Approval System
          </span>

        </div>

      </div>


      <div class="secure-badge">
        🔒 SECURE ACCESS
      </div>

    </div>

  </header>


  <!-- ======================================================
       MAIN CONTENT
  ======================================================= -->

  <main
    id="appContent"
    class="content"
  ></main>


  <!-- ======================================================
       FOOTER
  ======================================================= -->

  <div class="footer">

    Barangay Rabies Control Committee
    <br>
    Dog Management System (BRCC-DMS)

  </div>


</div>


<!-- ========================================================
     MODAL
======================================================== -->

<div
  id="modalOverlay"
  class="modal-overlay"
>

  <div
    id="modalContent"
    class="modal"
  ></div>

</div>


<!-- ========================================================
     TOAST
======================================================== -->

<div
  id="toast"
  class="toast"
></div>


<script>

const APP = {
  sessionToken: '',
  requests: []
};


/* ==========================================
   CONFIG
========================================== */

const API_URL =
  'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';


/* ==========================================
   INITIALIZE
========================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {
    showLogin();
  }
);


/* ==========================================
   LOGIN SCREEN
========================================== */

function showLogin() {

  document.getElementById('appContent').innerHTML = `

    <div class="login-screen">

      <div class="login-card">

        <div class="login-icon">
          🔐
        </div>

        <h2>
          Administrator Access
        </h2>

        <p>
          Authorized personnel only. Enter your Admin PIN to access pending registry update requests.
        </p>

        <div class="security-note">
          🔒 This Approval Center allows authorized administrators to review, approve, or reject Dog Registry update requests.
        </div>

        <label>
          ADMIN PIN
        </label>

        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          placeholder="Enter Admin PIN"
          autocomplete="off"
        >

        <button
          class="btn-primary"
          onclick="login()"
        >
          🔐 Access Approval Center
        </button>

      </div>

    </div>

  `;


  setTimeout(function() {

    const input =
      document.getElementById('pinInput');

    if (input) {

      input.focus();

      input.addEventListener(
        'keydown',
        function(event) {

          if (event.key === 'Enter') {
            login();
          }

        }
      );

    }

  }, 100);

}


/* ==========================================
   LOGIN
========================================== */

async function login() {

  const pin =
    document.getElementById('pinInput')
      .value
      .trim();


  if (!pin) {

    showToast(
      'Please enter your Admin PIN.',
      'error'
    );

    return;

  }


  showLoading(
    'Verifying Administrator Access...'
  );


  try {

    const response =
      await apiCall(
        'login',
        {
          pin: pin
        }
      );


    const result =
      response.result || response;


    if (
      !result.success ||
      !result.sessionToken
    ) {

      throw new Error(
        result.message ||
        'Authentication failed.'
      );

    }


    APP.sessionToken =
      result.sessionToken;


    showToast(
      'Administrator access granted.',
      'success'
    );


    loadPendingRequests();

  }
  catch (error) {

    showToast(
      error.message ||
      'Unable to login.',
      'error'
    );

    showLogin();

  }

}


/* ==========================================
   LOAD PENDING REQUESTS
========================================== */

async function loadPendingRequests() {

  showLoading(
    'Loading pending registry update requests...'
  );


  try {

    const response =
      await apiCall(
        'get_pending_requests',
        {
          sessionToken:
            APP.sessionToken
        }
      );


    const result =
      response.result || response;


    if (!result.success) {

      throw new Error(
        result.message ||
        'Unable to load pending requests.'
      );

    }


    APP.requests =
      result.requests || [];


    showDashboard();

  }
  catch (error) {

    if (
      String(error.message)
        .toLowerCase()
        .includes('session')
    ) {

      APP.sessionToken = '';

      showToast(
        'Your session has expired. Please login again.',
        'error'
      );

      showLogin();

      return;

    }


    showToast(
      error.message ||
      'Unable to load pending requests.',
      'error'
    );


    showLogin();

  }

}


/* ==========================================
   DASHBOARD
========================================== */

function showDashboard() {

  const requests =
    APP.requests;


  let html = `

    <div class="dashboard-top">

      <div>

        <h2 class="dashboard-title">
          Pending Requests
        </h2>

        <div
          class="request-count"
          style="display:inline-block;margin-top:6px"
        >
          ${requests.length} Pending
        </div>

      </div>


      <button
        class="btn-refresh"
        onclick="loadPendingRequests()"
      >
        ↻ Refresh
      </button>

    </div>

  `;


  if (requests.length === 0) {

    html += `

      <div class="empty">

        <div class="empty-icon">
          ✓
        </div>

        <h3>
          No Pending Requests
        </h3>

        <p>
          All registry update requests have been reviewed.
        </p>

      </div>

    `;

  }
  else {

    requests.forEach(
      function(request) {

        html +=
          createRequestCard(request);

      }
    );

  }


  document.getElementById(
    'appContent'
  ).innerHTML =
    html;

}


/* ==========================================
   REQUEST CARD
========================================== */

function createRequestCard(request) {

  return `

    <div class="request-card">

      <div class="request-card-header">

        <div class="request-id">
          ${escapeHtml(request.requestId)}
        </div>

        <div class="dog-name">
          🐕 ${escapeHtml(request.dogName || 'Unknown Dog')}
        </div>

      </div>


      <div class="request-card-body">

        <div class="info-row">

          <span class="info-label">
            Registry Number
          </span>

          <div class="info-value">
            ${escapeHtml(request.registryNumber)}
          </div>

        </div>


        <div class="info-row">

          <span class="info-label">
            Owner
          </span>

          <div class="info-value">
            ${escapeHtml(request.ownerName)}
          </div>

        </div>


        <div class="info-row">

          <span class="info-label">
            Update Type
          </span>

          <div class="info-value">
            ${escapeHtml(request.updateType)}
          </div>

        </div>


        <div class="update-box">

          <span class="info-label">
            Requested Update
          </span>

          <div class="info-value">
            ${escapeHtml(request.requestedInformation)}
          </div>

        </div>

      </div>


      <div class="actions">

        <button
          class="btn-approve"
          onclick="confirmApprove('${escapeJs(request.requestId)}')"
        >
          ✓ Approve
        </button>


        <button
          class="btn-reject"
          onclick="showRejectModal('${escapeJs(request.requestId)}')"
        >
          ✕ Reject
        </button>

      </div>

    </div>

  `;

}


/* ==========================================
   APPROVE CONFIRMATION
========================================== */

function confirmApprove(requestId) {

  showModal(`

    <h3>
      Approve Update?
    </h3>

    <p>
      This will process the registry update using the existing BRCC-DMS approval system.
    </p>

    <div class="modal-actions">

      <button
        class="btn-cancel"
        onclick="closeModal()"
      >
        Cancel
      </button>


      <button
        class="btn-approve"
        onclick="approveRequest('${escapeJs(requestId)}')"
      >
        ✓ Approve
      </button>

    </div>

  `);

}


/* ==========================================
   REJECT MODAL
========================================== */

function showRejectModal(requestId) {

  showModal(`

    <h3>
      Reject Update
    </h3>

    <p>
      Please provide a reason for rejection.
    </p>


    <textarea
      id="rejectionReason"
      rows="4"
      placeholder="Enter rejection reason..."
    ></textarea>


    <div class="modal-actions">

      <button
        class="btn-cancel"
        onclick="closeModal()"
      >
        Cancel
      </button>


      <button
        class="btn-reject"
        onclick="submitReject('${escapeJs(requestId)}')"
      >
        ✕ Reject
      </button>

    </div>

  `);

}


/* ==========================================
   SUBMIT REJECTION
========================================== */

function submitReject(requestId) {

  const reason =
    document.getElementById(
      'rejectionReason'
    )
      .value
      .trim();


  if (!reason) {

    showToast(
      'Please provide a rejection reason.',
      'error'
    );

    return;

  }


  rejectRequest(
    requestId,
    reason
  );

}


/* ==========================================
   APPROVE REQUEST
========================================== */

async function approveRequest(requestId) {

  closeModal();


  showLoading(
    'Approving update and regenerating documents...'
  );


  try {

    const response =
      await apiCall(
        'approve_request',
        {

          sessionToken:
            APP.sessionToken,

          requestId:
            requestId

        }
      );


    const result =
      response.result || response;


    if (!result.success) {

      throw new Error(
        result.message ||
        'Unable to approve request.'
      );

    }


    showToast(
      'Request approved successfully.',
      'success'
    );


    setTimeout(
      loadPendingRequests,
      1000
    );

  }
  catch (error) {

    handleRequestError_(error);

  }

}


/* ==========================================
   REJECT REQUEST
========================================== */

async function rejectRequest(
  requestId,
  rejectionReason
) {

  closeModal();


  showLoading(
    'Rejecting registry update request...'
  );


  try {

    const response =
      await apiCall(
        'reject_request',
        {

          sessionToken:
            APP.sessionToken,

          requestId:
            requestId,

          rejectionReason:
            rejectionReason

        }
      );


    const result =
      response.result || response;


    if (!result.success) {

      throw new Error(
        result.message ||
        'Unable to reject request.'
      );

    }


    showToast(
      'Request rejected successfully.',
      'success'
    );


    setTimeout(
      loadPendingRequests,
      1000
    );

  }
  catch (error) {

    handleRequestError_(error);

  }

}


/* ==========================================
   HANDLE REQUEST ERROR
========================================== */

function handleRequestError_(error) {

  const message =
    error.message ||
    'Unable to process request.';


  showToast(
    message,
    'error'
  );


  if (
    message
      .toLowerCase()
      .includes('session')
  ) {

    APP.sessionToken = '';

    setTimeout(
      showLogin,
      1000
    );

  }
  else {

    setTimeout(
      loadPendingRequests,
      1200
    );

  }

}


/* ==========================================
   API CALL
========================================== */

async function apiCall(
  action,
  data
) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify({

            action:
              action,

            data:
              data || {}

          })

      }
    );


  const text =
    await response.text();


  let json;


  try {

    json =
      JSON.parse(text);

  }
  catch (error) {

    console.error(
      'API RESPONSE:',
      text
    );

    throw new Error(
      'Invalid server response.'
    );

  }


  if (
    json.success === false
  ) {

    throw new Error(
      json.message ||
      'Server request failed.'
    );

  }


  return json;

}


/* ==========================================
   LOADING
========================================== */

function showLoading(message) {

  document.getElementById(
    'appContent'
  ).innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      <div>
        ${escapeHtml(message)}
      </div>

    </div>

  `;

}


/* ==========================================
   MODAL
========================================== */

function showModal(html) {

  document.getElementById(
    'modalContent'
  ).innerHTML =
    html;


  document.getElementById(
    'modalOverlay'
  ).style.display =
    'flex';

}


function closeModal() {

  document.getElementById(
    'modalOverlay'
  ).style.display =
    'none';

}


/* ==========================================
   TOAST
========================================== */

function showToast(
  message,
  type
) {

  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.className =
    'toast ' +
    (type || 'success');


  toast.style.display =
    'block';


  setTimeout(
    function() {

      toast.style.display =
        'none';

    },
    3500
  );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

  return String(value || '')

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* ==========================================
   ESCAPE JAVASCRIPT
========================================== */

function escapeJs(value) {

  return String(value || '')

    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');

}
