<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .page {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header-left h1 {
      margin: 0;
      font-size: 26px;
    }

    .header-left p {
      margin: 5px 0 0;
      color: #777;
      font-size: 13px;
    }

    .back-btn {
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      background: #fff;
      color: #333;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.dashboard-btn {
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  background: #222;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.dashboard-btn:hover {
  opacity: .9;
}

    /* =========================================
       SUMMARY
    ========================================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .summary-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .summary-count {
      font-size: 32px;
      font-weight: bold;
    }


    /* =========================================
       MAIN CARD
    ========================================= */

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
    }

    .refresh-btn {
      border: none;
      background: #f1f3f5;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }


    /* =========================================
       TABS
    ========================================= */

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #eee;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      border: none;
      background: none;
      padding: 12px 16px;
      cursor: pointer;
      color: #777;
      font-size: 13px;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #222;
      font-weight: bold;
      border-bottom-color: #222;
    }


    /* =========================================
       REQUEST LIST
    ========================================= */

    .request-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .request-item {
      border: 1px solid #e4e7eb;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .request-item:hover {
      background: #fafafa;
    }

    .request-main {
      flex: 1;
      min-width: 0;
    }

    .request-photo-thumb {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border-radius: 12px;
      overflow: hidden;
      background: #f1f3f5;
      border: 1px solid #e0e4e8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 28px;
    }

    .request-photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .request-photo-missing {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .request-title {
      font-weight: bold;
      font-size: 16px;
    }

    .request-subtitle {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .request-meta {
      font-size: 11px;
      color: #888;
      margin-top: 7px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      background: #f1f3f5;
      font-size: 10px;
      font-weight: bold;
      margin-left: 6px;
    }

    .view-btn {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: #fff;
      font-size: 12px;
      flex-shrink: 0;
    }


    /* =========================================
       EMPTY
    ========================================= */

    .empty {
      text-align: center;
      padding: 50px 15px;
      color: #888;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }


    /* =========================================
       LOADING
    ========================================= */

    .loading {
      text-align: center;
      padding: 35px;
      color: #777;
    }


    /* =========================================
       MODAL
    ========================================= */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .modal {
      background: #fff;
      max-width: 750px;
      margin: 20px auto;
      border-radius: 16px;
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
    }

    .close-btn {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
      color: #777;
    }

    .modal-body {
      padding: 20px;
    }


    /* =========================================
       DETAILS
    ========================================= */

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-section h3 {
      font-size: 14px;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .detail-item label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }

    .detail-item div {
      font-size: 14px;
      word-break: break-word;
    }

    .highlight-box {
      padding: 15px;
      border-radius: 10px;
      background: #f6f7f8;
      margin-bottom: 15px;
    }


    /* =========================================
       PHOTO
    ========================================= */

    .dog-photo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .dog-photo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid #ddd;
    }

/* =========================================
   PHOTO COMPARISON
========================================= */

.photo-comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 12px;
}

.photo-compare-card {
  border: 1px solid #e4e7eb;
  border-radius: 12px;
  padding: 12px;
  background: #fafafa;
  text-align: center;
}

.photo-compare-label {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #555;
  text-transform: uppercase;
}

.photo-compare-image {
  width: 100%;
  max-width: 260px;
  height: 230px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.photo-unavailable {
  height: 230px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #ccc;
  border-radius: 10px;
  color: #999;
  font-size: 12px;
}

@media(max-width:600px) {

  .photo-comparison {
    grid-template-columns: 1fr;
  }

}

    /* =========================================
       ACTIONS
    ========================================= */

    .action-section {
      border-top: 1px solid #eee;
      padding-top: 20px;
      margin-top: 10px;
    }

    .remarks {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 12px;
      font-family: inherit;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .approve-btn,
    .reject-btn {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .approve-btn {
      background: #222;
      color: #fff;
    }

    .reject-btn {
      background: #f1f1f1;
      color: #b00020;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media(max-width:600px) {

      .page {
        padding: 14px 10px;
      }

      .header-left h1 {
        font-size: 21px;
      }

      .summary-grid {
        gap: 8px;
      }

      .summary-card {
        padding: 13px;
      }

      .summary-count {
        font-size: 25px;
      }

      .summary-label {
        font-size: 10px;
      }

      .request-item {
        align-items: center;
        gap: 10px;
      }

      .request-photo-thumb {
        width: 64px;
        height: 64px;
        flex-basis: 64px;
        border-radius: 10px;
      }

      .request-main {
        flex: 1;
      }

      .view-btn {
        width: 100%;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .modal-overlay {
        padding: 0;
      }

      .modal {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
      }

    }

    /* =========================================
   PHOTO COMPARISON
========================================= */

.photo-comparison {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.photo-comparison-card {
  border: 1px solid #e4e7eb;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  background: #fafafa;
}

.photo-comparison-label {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  color: #777;
  margin-bottom: 10px;
}

.photo-comparison-image {
  width: 100%;
  max-width: 280px;
  height: 250px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.photo-missing {
  height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #ccc;
  border-radius: 10px;
  color: #999;
  font-size: 13px;
}

@media(max-width:600px) {

  .photo-comparison {
    grid-template-columns: 1fr;
  }

}

  </style>
</head>


<body>

<div class="page">

  <!-- HEADER -->

  <div class="header">

    <div class="header-left">

      <h1>Approval Center</h1>

      <p>
        Review and process pending public submissions
      </p>

    </div>

<div class="header-actions">

  <button
    class="dashboard-btn"
    onclick="backToDashboard()">

    🏠 Dashboard

  </button>

  <button
    class="back-btn"
    onclick="google.script.host.close()">

    ✕ Close

  </button>

</div>

  </div>


  <!-- SUMMARY -->

  <div class="summary-grid">

    <div class="summary-card">

      <div class="summary-label">
        Dog Registrations
      </div>

      <div
        class="summary-count"
        id="dogRegistrationCount">

        -

      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Registry Updates
      </div>

      <div
        class="summary-count"
        id="registryUpdateCount">

        -

      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        Puppy Reports
      </div>

      <div
        class="summary-count"
        id="puppyReportCount">

        -

      </div>

    </div>

  </div>


  <!-- MAIN CARD -->

  <div class="card">

    <div class="card-header">

      <div
        class="card-title"
        id="sectionTitle">

        Pending Requests

      </div>

      <button
        class="refresh-btn"
        onclick="loadApprovalCenter()">

        ↻ Refresh

      </button>

    </div>


    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab-btn active"
        data-tab="registration"
        onclick="switchTab('registration')">

        🐕 Dog Registrations

      </button>


      <button
        class="tab-btn"
        data-tab="update"
        onclick="switchTab('update')">

        ✏️ Registry Updates

      </button>


      <button
        class="tab-btn"
        data-tab="puppy"
        onclick="switchTab('puppy')">

        🐶 Puppy Reports

      </button>

    </div>


    <!-- REQUEST LIST -->

    <div
      class="request-list"
      id="requestList">

      <div class="loading">
        Loading requests...
      </div>

    </div>

  </div>

</div>


<!-- =========================================
     DETAILS MODAL
========================================= -->

<div
  class="modal-overlay"
  id="detailsModal">

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="modalTitle">

        Request Details

      </div>

      <button
        class="close-btn"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div
      class="modal-body"
      id="modalBody">

      Loading...

    </div>

  </div>

</div>


<script>

/* ==========================================================
   GLOBAL STATE
========================================================== */

var currentTab = 'registration';

var currentRequest = null;

var dashboardData = {
  registryUpdates: [],
  puppyRequests: []
};


/* ==========================================================
   INITIALIZE
========================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {
    loadApprovalCenter();
  }
);


/* ==========================================================
   LOAD APPROVAL CENTER
========================================================== */

function loadApprovalCenter() {

  loadSummary();

  if (currentTab === 'registration') {
    loadPendingDogRegistrations();
  } else {
    loadRequestDashboardData();
  }

}


/* ==========================================================
   SWITCH TAB
========================================================== */

function switchTab(tab) {

  currentTab = tab;

  document
    .querySelectorAll('.tab-btn')
    .forEach(function(button) {
      button.classList.remove('active');
    });


  var activeButton =
    document.querySelector(
      '[data-tab="' + tab + '"]'
    );


  if (activeButton) {
    activeButton.classList.add('active');
  }


  var container =
    document.getElementById(
      'requestList'
    );


  /* DOG REGISTRATIONS */

  if (tab === 'registration') {

    document.getElementById(
      'sectionTitle'
    ).textContent =
      'Pending Dog Registrations';


    container.innerHTML =
      '<div class="loading">Loading dog registration requests...</div>';


    loadPendingDogRegistrations();

    return;

  }


  /* REGISTRY UPDATES */

  if (tab === 'update') {

    document.getElementById(
      'sectionTitle'
    ).textContent =
      'Pending Registry Updates';


    if (
      dashboardData.registryUpdates &&
      dashboardData.registryUpdates.length
    ) {

      renderRegistryUpdates(
        dashboardData.registryUpdates
      );

    } else {

      container.innerHTML =
        '<div class="loading">Loading registry updates...</div>';

      loadRequestDashboardData();

    }

    return;

  }


  /* PUPPY REPORTS */

  if (tab === 'puppy') {

    document.getElementById(
      'sectionTitle'
    ).textContent =
      'Pending Puppy Reports';


    if (
      dashboardData.puppyRequests &&
      dashboardData.puppyRequests.length
    ) {

      renderPuppyRequests(
        dashboardData.puppyRequests
      );

    } else {

      container.innerHTML =
        '<div class="loading">Loading puppy reports...</div>';

      loadRequestDashboardData();

    }

  }

}


/* ==========================================================
   LOAD SUMMARY
========================================================== */

function loadSummary() {

  google.script.run

    .withSuccessHandler(function(result) {

      if (!result || !result.success) {
        return;
      }


      document.getElementById(
        'dogRegistrationCount'
      ).textContent =
        result.counts.dogRegistrations || 0;


      document.getElementById(
        'registryUpdateCount'
      ).textContent =
        result.counts.registryUpdates || 0;


      document.getElementById(
        'puppyReportCount'
      ).textContent =
        result.counts.puppyReports || 0;

    })

    .withFailureHandler(function(error) {

      console.error(
        'Summary error:',
        error
      );

    })

    .getApprovalCenterSummary();

}


/* ==========================================================
   LOAD REGISTRY UPDATE + PUPPY DATA
========================================================== */

function loadRequestDashboardData() {

  google.script.run

    .withSuccessHandler(function(result) {

      console.log(
        'Approval dashboard result:',
        result
      );


      dashboardData = {
        registryUpdates:
          result &&
          result.registryUpdates
            ? result.registryUpdates
            : [],

        puppyRequests:
          result &&
          result.puppyRequests
            ? result.puppyRequests
            : (
                result &&
                result.requests
                  ? result.requests
                  : []
              )
      };


      if (currentTab === 'update') {

        renderRegistryUpdates(
          dashboardData.registryUpdates
        );

        return;

      }


      if (currentTab === 'puppy') {

        renderPuppyRequests(
          dashboardData.puppyRequests
        );

        return;

      }

    })

    .withFailureHandler(function(error) {

      console.error(
        'Dashboard request error:',
        error
      );


      if (
        currentTab === 'update' ||
        currentTab === 'puppy'
      ) {

        document.getElementById(
          'requestList'
        ).innerHTML =

          '<div class="empty">' +
          '<div class="empty-icon">⚠</div>' +
          '<div>Unable to load requests.</div>' +
          '<div style="font-size:11px;margin-top:8px;color:#999;">' +
          escapeHtml(
            error && error.message
              ? error.message
              : String(error)
          ) +
          '</div>' +
          '</div>';

      }

    })

    .getRequestDashboardData();

}


/* ==========================================================
   LOAD DOG REGISTRATION REQUESTS
========================================================== */

function loadPendingDogRegistrations() {

  if (currentTab !== 'registration') {
    return;
  }


  var container =
    document.getElementById('requestList');


  container.innerHTML =
    '<div class="loading">Loading dog registration requests...</div>';


  google.script.run

    .withSuccessHandler(function(result) {

      console.log(
        'Dog registration response:',
        result
      );


      if (currentTab !== 'registration') {
        return;
      }


      if (!result) {

        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠</div>
            <div>No response received from server.</div>
          </div>
        `;

        return;

      }


      if (result.success !== true) {

        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠</div>
            <div>
              ${escapeHtml(
                result.message ||
                'Unable to load dog registration requests.'
              )}
            </div>
          </div>
        `;

        return;

      }


      renderDogRegistrationRequests(
        Array.isArray(result.requests)
          ? result.requests
          : []
      );

    })

    .withFailureHandler(function(error) {

      console.error(
        'getPendingDogRegistrationRequests FAILED:',
        error
      );


      if (currentTab !== 'registration') {
        return;
      }


      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠</div>
          <div>
            Unable to load dog registration requests.
          </div>
          <div style="
            margin-top:8px;
            font-size:11px;
            color:#999;
          ">
            ${escapeHtml(
              error && error.message
                ? error.message
                : String(error || '')
            )}
          </div>
        </div>
      `;

    })

    .getPendingDogRegistrationRequests();

}


/* ==========================================================
   RENDER DOG REGISTRATION REQUESTS
========================================================== */

function renderDogRegistrationRequests(requests) {

  var container =
    document.getElementById('requestList');


  console.log(
    'Rendering dog registration requests:',
    requests
  );


  if (!requests || !requests.length) {

    renderEmpty(
      '✓',
      'No pending dog registration requests.'
    );

    return;

  }


  var html = '';


  requests.forEach(function(request) {

    html += `

      <div class="request-item">

        <div class="request-photo-thumb">
          ${
            request.dogPhotoFileId
              ? `
                <img
                  src="https://drive.google.com/thumbnail?id=${encodeURIComponent(
                    request.dogPhotoFileId
                  )}&sz=w200"
                  alt="Dog Photo"
                  loading="lazy"
                  onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                  "
                >
                <div class="request-photo-missing" style="display:none;">🐶</div>
              `
              : `
                <div class="request-photo-missing">🐶</div>
              `
          }
        </div>

        <div class="request-main">

          <div class="request-title">

            ${escapeHtml(
              request.dogName || '-'
            )}

            <span class="badge">

              ${escapeHtml(
                request.status || 'PENDING'
              )}

            </span>

          </div>


          <div class="request-subtitle">

            Owner:
            ${escapeHtml(
              request.ownerName || '-'
            )}

          </div>


          <div class="request-meta">

            ${escapeHtml(
              request.requestNumber || '-'
            )}

            •

            Breed:
            ${escapeHtml(
              request.breed || '-'
            )}

            •

            Sitio:
            ${escapeHtml(
              request.sitio || '-'
            )}

            •

            ${escapeHtml(
              request.submittedAt || '-'
            )}

          </div>

        </div>


        <button
          class="view-btn"
          onclick="viewDogRegistration('${escapeAttribute(
            request.requestNumber || ''
          )}')">

          Review

        </button>

      </div>

    `;

  });


  container.innerHTML = html;

}


/* ==========================================================
   RENDER REGISTRY UPDATES
========================================================== */

function renderRegistryUpdates(requests) {

  if (!requests || !requests.length) {

    renderEmpty(
      '✓',
      'No pending registry updates.'
    );

    return;

  }


  var html = '';


  requests.forEach(function(request) {

    html += `

      <div class="request-item">

        <div class="request-photo-thumb">
          ${
            request.dogPhotoFileId
              ? `
                <img

/* ==========================================================
   GET GOOGLE DRIVE FILE ID
========================================================== */

function extractGoogleDriveFileId_(value) {

  if (!value) {
    return '';
  }


  value =
    String(value).trim();


  /*
   * Already a File ID
   */

  if (
    /^[a-zA-Z0-9_-]{20,}$/
      .test(value)
  ) {

    return value;

  }


  /*
   * /d/FILE_ID/
   */

  var match =
    value.match(
      /\/d\/([a-zA-Z0-9_-]+)/
    );

  if (match && match[1]) {
    return match[1];
  }


  /*
   * ?id=FILE_ID
   */

  match =
    value.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );

  if (match && match[1]) {
    return match[1];
  }


  return '';

}



/* ==========================================================
   BUILD DISPLAYABLE PHOTO URL
========================================================== */

function getDisplayPhotoUrl_(
  fileId,
  url
) {

  var source =
    String(
      fileId || url || ''
    ).trim();


  if (!source) {
    return '';
  }


  if (
    source.startsWith('data:')
  ) {
    return source;
  }


  var driveFileId =
    extractGoogleDriveFileId_(
      fileId || url
    );


  if (driveFileId) {

    return (
      'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(
        driveFileId
      ) +
      '&sz=w1000'
    );

  }


  return source;

}

/* ==========================================================
   NORMALIZE GOOGLE DRIVE IMAGE URL

   Converts:

   https://drive.google.com/file/d/FILE_ID/view

   INTO:

   https://drive.google.com/uc?export=view&id=FILE_ID
========================================================== */

function normalizeDriveImageUrl_(url) {

  if (!url) {

    return '';

  }


  url =
    String(url).trim();


  /* ========================================
     EXTRACT GOOGLE DRIVE FILE ID
  ======================================== */

  var match =
    url.match(
      /\/d\/([a-zA-Z0-9_-]+)/
    );


  if (match && match[1]) {

    return (
      'https://drive.google.com/uc?export=view&id=' +
      match[1]
    );

  }


  /* ========================================
     ALTERNATIVE id= FORMAT
  ======================================== */

  var idMatch =
    url.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );


  if (idMatch && idMatch[1]) {

    return (
      'https://drive.google.com/uc?export=view&id=' +
      idMatch[1]
    );

  }


  /* ========================================
     RETURN ORIGINAL URL
  ======================================== */

  return url;

}

/* ==========================================================
   APPROVE CURRENT REQUEST
========================================================== */

function approveCurrentRequest() {

  if (!currentRequest) {
    return;
  }


  if (!confirm('Approve this request?')) {
    return;
  }


  setActionLoading(
    true,
    'Approving...'
  );


  var data =
    currentRequest.data;


  /* DOG REGISTRATION */

  if (
    currentRequest.type === 'registration'
  ) {

    google.script.run

      .withSuccessHandler(
        handleApprovalSuccess
      )

      .withFailureHandler(
        handleApprovalFailure
      )

      .approveDogRegistrationRequest(
        data.requestNumber,
        'Administrator'
      );

    return;

  }


  /* REGISTRY UPDATE */

  if (
    currentRequest.type === 'update'
  ) {

    var updateRequestId =
      getRequestId(data);


    if (!updateRequestId) {

      handleApprovalFailure(
        'Registry Update Request ID is missing.'
      );

      return;

    }


    google.script.run

      .withSuccessHandler(
        handleApprovalSuccess
      )

      .withFailureHandler(
        handleApprovalFailure
      )

      .approveRegistryRequest(
        updateRequestId,
        'BRCC Admin'
      );

    return;

  }


  /* PUPPY REPORT */

  if (
    currentRequest.type === 'puppy'
  ) {

    var puppyRequestId =
      getRequestId(data);


    if (!puppyRequestId) {

      handleApprovalFailure(
        'Puppy Request ID is missing.'
      );

      return;

    }


    google.script.run

      .withSuccessHandler(
        handleApprovalSuccess
      )

      .withFailureHandler(
        handleApprovalFailure
      )

      .approvePuppyRequest(
        puppyRequestId,
        'BRCC Admin'
      );

    return;

  }


  handleApprovalFailure(
    'Unknown request type.'
  );

}


/* ==========================================================
   REJECT CURRENT REQUEST
========================================================== */

function rejectCurrentRequest() {

  if (!currentRequest) {
    return;
  }


  var remarksElement =
    document.getElementById(
      'reviewRemarks'
    );


  var remarks =
    remarksElement
      ? remarksElement.value.trim()
      : '';


  if (!remarks) {

    alert(
      'Please provide a reason for rejection.'
    );

    return;

  }


  if (!confirm('Reject this request?')) {
    return;
  }


  setActionLoading(
    true,
    'Rejecting...'
  );


  var data =
    currentRequest.data;


  /* DOG REGISTRATION */

  if (
    currentRequest.type === 'registration'
  ) {

    google.script.run

      .withSuccessHandler(
        handleApprovalSuccess
      )

      .withFailureHandler(
        handleApprovalFailure
      )

      .rejectDogRegistrationRequest(
        data.requestNumber,
        remarks,
        'Administrator'
      );

    return;

  }


  /* REGISTRY UPDATE */

  if (
    currentRequest.type === 'update'
  ) {

    var updateRequestId =
      getRequestId(data);


    if (!updateRequestId) {

      handleApprovalFailure(
        'Registry Update Request ID is missing.'
      );

      return;

    }


    google.script.run

      .withSuccessHandler(
        handleApprovalSuccess
      )

      .withFailureHandler(
        handleApprovalFailure
      )

      .rejectRegistryRequest(
        updateRequestId,
        'BRCC Admin',
        remarks
      );

    return;

  }


  /* PUPPY REPORT */

  if (
    currentRequest.type === 'puppy'
  ) {

    var puppyRequestId =
      getRequestId(data);


    if (!puppyRequestId) {

      handleApprovalFailure(
        'Puppy Request ID is missing.'
      );

      return;

    }


    google.script.run

      .withSuccessHandler(
        handleApprovalSuccess
      )

      .withFailureHandler(
        handleApprovalFailure
      )

      .rejectPuppyRequest(
        puppyRequestId,
        'BRCC Admin',
        remarks
      );

    return;

  }


  handleApprovalFailure(
    'Unknown request type.'
  );

}


/* ==========================================================
   ACTION LOADING
========================================================== */

function setActionLoading(loading, text) {

  var approveButton =
    document.getElementById(
      'approveButton'
    );


  var rejectButton =
    document.getElementById(
      'rejectButton'
    );


  if (approveButton) {

    approveButton.disabled =
      loading;

    if (loading) {
      approveButton.textContent =
        text;
    }

  }


  if (rejectButton) {

    rejectButton.disabled =
      loading;

    if (loading) {
      rejectButton.textContent =
        text;
    }

  }

}


/* ==========================================================
   APPROVAL SUCCESS
========================================================== */

function handleApprovalSuccess(result) {

  if (
    result &&
    result.success === false
  ) {

    handleApprovalFailure(
      result.message ||
      'Unable to process request.'
    );

    return;

  }


  alert(
    result && result.message
      ? result.message
      : 'Request processed successfully.'
  );


  closeModal();

  loadApprovalCenter();

}


/* ==========================================================
   APPROVAL FAILURE
========================================================== */

function handleApprovalFailure(error) {

  console.error(error);


  alert(
    'Unable to process request.\n\n' +
    (
      error &&
      error.message
        ? error.message
        : String(error || '')
    )
  );


  setActionLoading(
    false,
    ''
  );

}


/* ==========================================================
   OPEN MODAL
========================================================== */

function openModal(title) {

  document.getElementById(
    'detailsModal'
  ).style.display =
    'block';


  document.getElementById(
    'modalTitle'
  ).textContent =
    title ||
    'Request Details';


  document.getElementById(
    'modalBody'
  ).innerHTML =
    '<div class="loading">Loading...</div>';

}


/* ==========================================================
   CLOSE MODAL
========================================================== */

function closeModal() {

  document.getElementById(
    'detailsModal'
  ).style.display =
    'none';


  currentRequest =
    null;

}


/* ==========================================================
   EMPTY STATE
========================================================== */

function renderEmpty(icon, message) {

  document.getElementById(
    'requestList'
  ).innerHTML = `

    <div class="empty">

      <div class="empty-icon">
        ${escapeHtml(icon)}
      </div>

      <div>
        ${escapeHtml(message)}
      </div>

    </div>

  `;

}


/* ==========================================================
   FORMAT DATE
========================================================== */

function formatDate(value) {

  if (!value) {
    return '-';
  }


  try {

    var date =
      new Date(value);


    if (
      isNaN(date.getTime())
    ) {
      return String(value);
    }


    return date.toLocaleDateString(
      'en-PH',
      {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      }
    );

  } catch (error) {

    return String(value);

  }

}

/* ==========================================================
   NORMALIZE PHOTO URL
========================================================== */

function normalizePhotoUrl(url) {

  if (!url) {
    return '';
  }


  url =
    String(url).trim();


  if (
    url.startsWith('data:')
  ) {
    return url;
  }


  var fileId =
    extractGoogleDriveFileId_(url);


  if (fileId) {

    return (
      'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(fileId) +
      '&sz=w1000'
    );

  }


  return url;

}

/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return '';
  }


  return String(value)

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeAttribute(value) {

  return escapeHtml(value);

}

/* ==========================================================
   BACK TO DASHBOARD
========================================================== */

function backToDashboard() {

  google.script.run

    .withSuccessHandler(function() {

      google.script.host.close();

    })

    .withFailureHandler(function(error) {

      console.error(
        'Unable to open dashboard:',
        error
      );

      alert(
        'Unable to open dashboard.'
      );

    })

    .showDashboard();

}

/* ==========================================================
   CLOSE MODAL OUTSIDE CLICK
========================================================== */

document
  .getElementById(
    'detailsModal'
  )
  .addEventListener(
    'click',
    function(event) {

      if (event.target === this) {
        closeModal();
      }

    }
  );

</script>
