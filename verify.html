<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dog Registration Verification | Barangay Tupol Oeste
  </title>


  <style>

    /* ==========================================================
       GLOBAL
    ========================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #17352a;

      background:
        radial-gradient(
          circle at 10% 8%,
          rgba(53, 180, 105, .10),
          transparent 24%
        ),
        radial-gradient(
          circle at 92% 20%,
          rgba(53, 180, 105, .08),
          transparent 22%
        ),
        #f3f8f5;
    }


    /* ==========================================================
       PAGE
    ========================================================== */

    .page {

      width: 100%;
      max-width: 600px;

      margin: 0 auto;

      padding:
        14px
        14px
        20px;

      position: relative;

      overflow: hidden;
    }


    /* ==========================================================
       PAW BACKGROUND ACCENTS
    ========================================================== */

    .page::before,
    .page::after {

      position: absolute;

      font-size: 75px;

      color: rgba(31, 156, 83, .055);

      z-index: 0;

      pointer-events: none;
    }

    .page::before {

      content: "🐾";

      top: 120px;
      left: -10px;
    }

    .page::after {

      content: "🐾";

      top: 260px;
      right: -10px;
    }


    /* ==========================================================
       HEADER
    ========================================================== */

    .header {

      position: relative;
      z-index: 1;

      text-align: center;

      margin-bottom: 12px;

      padding:
        8px
        8px
        4px;
    }


    .logo {

      width: 62px;
      height: 62px;

      object-fit: contain;

      display: block;

      margin:
        0 auto
        5px;
    }


    .barangay-name {

      font-size: 21px;

      font-weight: 800;

      letter-spacing: .8px;

      text-transform: uppercase;

      color: #164b31;

      line-height: 1.15;
    }


    .location {

      font-size: 12px;

      color: #707a75;

      margin:
        4px 0
        9px;
    }


    .header h1 {

      margin: 0;

      font-size: 21px;

      line-height: 1.2;

      font-weight: 800;

      color: #145b36;
    }


    .header p {

      display: inline-block;

      margin:
        6px 0
        0;

      padding:
        5px
        12px;

      border-radius: 20px;

      background: #dff4e6;

      color: #176b3d;

      font-size: 11px;

      font-weight: 700;
    }


    /* ==========================================================
       MAIN CARD
    ========================================================== */

    .card {

      position: relative;
      z-index: 1;

      background: rgba(255,255,255,.97);

      border:
        1px solid
        #dfeee4;

      border-radius: 20px;

      padding: 17px;

      box-shadow:
        0 8px 28px
        rgba(35, 88, 57, .10);
    }


    /* ==========================================================
       LOADING
    ========================================================== */

    .loading {

      text-align: center;

      padding:
        30px
        10px;

      color: #68746e;
    }


    .spinner {

      width: 38px;
      height: 38px;

      border:
        4px solid
        #dcebe1;

      border-top-color:
        #20a65a;

      border-radius: 50%;

      margin:
        0 auto
        14px;

      animation:
        spin .8s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* ==========================================================
       CONTENT
    ========================================================== */

    #content {

      display: none;
    }


    /* ==========================================================
       VERIFICATION STATUS
    ========================================================== */

    .status {

      text-align: center;

      padding:
        0
        0
        10px;

      color: #159447;
    }


    .status-icon {

      width: 48px;
      height: 48px;

      margin:
        0 auto
        3px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #22b765;

      color: white;

      font-size: 32px;

      font-weight: 700;

      line-height: 1;

      box-shadow:
        0 5px 14px
        rgba(34, 183, 101, .20);
    }


    .status h2 {

      margin:
        4px 0
        7px;

      font-size: 30px;

      line-height: 1;

      font-weight: 800;

      letter-spacing: -.5px;
    }


    .valid-badge {

      display: inline-block;

      padding:
        6px
        13px;

      border-radius: 20px;

      background: #e3f6ea;

      color: #198348;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: .2px;
    }


    /* ==========================================================
       DOG PHOTO
    ========================================================== */

    .dog-photo {

      display: block;

      width: 112px;
      height: 112px;

      object-fit: cover;

      border-radius: 50%;

      margin:
        5px auto
        13px;

      border:
        4px solid
        #e5f5ea;

      outline:
        2px solid
        #2bb66b;

      box-shadow:
        0 4px 15px
        rgba(30, 100, 57, .12);
    }


    /* ==========================================================
       OWNER SUMMARY
    ========================================================== */

    .owner-summary {

      margin:
        0
        0
        13px;

      padding:
        2px
        10px;

      background:
        linear-gradient(
          135deg,
          #f1fbf4,
          #e9f7ee
        );

      border:
        1px solid
        #dcefe3;

      border-radius: 13px;
    }


    .owner-summary .row {

      border-bottom:
        1px solid
        #dcebe1;
    }


    .owner-summary .row:last-child {

      border-bottom: none;
    }


    .owner-summary .label {

      font-weight: 600;
    }


    /* ==========================================================
       ROWS
    ========================================================== */

    .row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding:
        9px
        0;

      border-bottom:
        1px solid
        #e7ece9;
    }


    .label {

      color: #78817d;

      font-size: 12px;

      line-height: 1.25;

      flex: 1;
    }


    .value {

      text-align: right;

      font-weight: 700;

      font-size: 13px;

      color: #26332d;

      max-width: 62%;

      word-break: break-word;
    }


    /* ==========================================================
       REGISTRY NUMBER
    ========================================================== */

    .registry-number {

      text-align: center;

      margin:
        0 0
        4px;

      padding:
        9px
        8px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #e4f7ea,
          #d9f2e2
        );

      color: #126038;

      font-weight: 800;

      font-size: 20px;

      letter-spacing: .2px;

      border:
        1px solid
        #d1ebda;
    }


    /* ==========================================================
       DETAILS
    ========================================================== */

    .details {

      border-top: none;
    }


    .details .row:last-child {

      border-bottom: none;
    }


    /* ==========================================================
       ACTIVE STATUS
    ========================================================== */

    .details .row:nth-child(4) .value {

      color: #168c48;
    }


    /* ==========================================================
       INVALID
    ========================================================== */

    .invalid-box {

      text-align: center;

      padding:
        25px
        10px;
    }


    .invalid-box .status-icon {

      background: #dc3e3e;

      box-shadow: none;
    }


    .invalid {

      color: #c62828;
    }


    .invalid-box p {

      color: #68716d;

      line-height: 1.5;

      font-size: 13px;
    }


    /* ==========================================================
       FOOTER
       No slogan / no sayings
    ========================================================== */

    .footer {

      position: relative;
      z-index: 1;

      text-align: center;

      color: #7b8580;

      font-size: 11px;

      margin-top: 14px;

      line-height: 1.55;
    }


    /* ==========================================================
       MOBILE
    ========================================================== */

    @media (max-width: 480px) {

      .page {

        padding:
          10px
          10px
          16px;
      }


      .header {

        margin-bottom: 9px;

        padding-top: 3px;
      }


      .logo {

        width: 58px;
        height: 58px;

        margin-bottom: 4px;
      }


      .barangay-name {

        font-size: 19px;
      }


      .location {

        font-size: 11px;

        margin:
          3px 0
          7px;
      }


      .header h1 {

        font-size: 20px;
      }


      .header p {

        margin-top: 5px;

        font-size: 10px;

        padding:
          5px
          11px;
      }


      .card {

        padding:
          14px;

        border-radius: 18px;
      }


      .status {

        padding-bottom: 8px;
      }


      .status-icon {

        width: 44px;
        height: 44px;

        font-size: 29px;
      }


      .status h2 {

        font-size: 28px;

        margin:
          4px 0
          6px;
      }


      .valid-badge {

        font-size: 10px;

        padding:
          5px
          11px;
      }


      .dog-photo {

        width: 100px;
        height: 100px;

        margin:
          4px auto
          11px;
      }


      .owner-summary {

        margin-bottom: 10px;

        padding:
          1px
          9px;
      }


      .row {

        padding:
          8px
          0;

        gap: 8px;
      }


      .label {

        font-size: 11px;
      }


      .value {

        font-size: 12px;
      }


      .registry-number {

        font-size: 18px;

        padding:
          8px 6px;

        margin-bottom: 2px;
      }


      .footer {

        margin-top: 10px;

        font-size: 10px;
      }

    }


    /* ==========================================================
       VERY SMALL PHONES
    ========================================================== */

    @media (max-width: 360px) {

      .page {

        padding:
          8px
          8px
          14px;
      }


      .barangay-name {

        font-size: 17px;
      }


      .header h1 {

        font-size: 18px;
      }


      .card {

        padding:
          12px;
      }


      .status h2 {

        font-size: 25px;
      }


      .dog-photo {

        width: 92px;
        height: 92px;
      }


      .registry-number {

        font-size: 17px;
      }

    }

  </style>

</head>


<body>


<div class="page">


  <!-- ========================================================
       HEADER
  ========================================================= -->

  <div class="header">

    <img
      src="barangay-logo.png"
      class="logo"
      alt="Barangay Tupol Oeste Logo"
    >

    <div class="barangay-name">
      Barangay Tupol Oeste
    </div>

    <div class="location">
      Municipality of Cabatuan, Province of Iloilo
    </div>

    <h1>
      Dog Registration Verification
    </h1>

    <p>
      Barangay Rabies Control Committee
    </p>

  </div>


  <!-- ========================================================
       VERIFICATION CARD
  ========================================================= -->

  <div class="card">


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div>
        Verifying dog registration...
      </div>

    </div>


    <!-- RESULT -->

    <div id="content"></div>


  </div>


  <!-- ========================================================
       FOOTER
       NO SAYING / NO SLOGAN
  ========================================================= -->

  <div class="footer">

    Barangay Tupol Oeste<br>

    Cabatuan, Iloilo<br>

    BRCC-DMS V3

  </div>


</div>


<script src="api.js"></script>


<script>

  /* ==========================================================
     GET QR TOKEN
  ========================================================== */

  function getVerificationToken() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    return String(
      params.get('token') || ''
    ).trim();

  }


  /* ==========================================================
     LOAD VERIFICATION
  ========================================================== */

  async function loadVerification() {

  const token =
    getVerificationToken();


  if (!token) {

    showInvalid(
      'No verification token was provided.'
    );

    return;

  }


  const maxAttempts = 3;

  let lastError = null;


  for (
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ) {

    try {

      const loading =
        document.getElementById('loading');


      /*
       * Show a friendly loading message
       * while connecting/retrying.
       */

      if (attempt === 1) {

        loading.innerHTML =
          '<div class="spinner"></div>' +
          '<div>Verifying dog registration...</div>';

      } else {

        loading.innerHTML =
          '<div class="spinner"></div>' +
          '<div>Connecting to verification server...</div>' +
          '<div style="font-size:11px;margin-top:6px;color:#888;">' +
          'Please wait...' +
          '</div>';

      }


      loading.style.display =
        'block';


      const response =
        await brccRequest(
          'verify_dog_qr',
          {
            token: token
          }
        );


      /*
       * API wrapper:
       *
       * {
       *   success: true,
       *   service: "verify_dog_qr",
       *   result: {...}
       * }
       */

      const result =
        response.result ||
        response;


      /*
       * SUCCESSFUL SERVER RESPONSE
       */

      showVerification(
        result
      );


      return;


    } catch (error) {

      lastError = error;


      console.warn(
        'QR verification attempt ' +
        attempt +
        ' failed:',
        error
      );


      /*
       * Retry automatically.
       */

      if (
        attempt < maxAttempts
      ) {

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1000
            );

          }
        );

      }

    }

  }


  /*
   * All attempts failed.
   *
   * IMPORTANT:
   * Do NOT call this UNVERIFIED.
   * The dog may still be valid.
   */

  console.error(
    'QR verification failed after ' +
    maxAttempts +
    ' attempts:',
    lastError
  );


  document
    .getElementById('loading')
    .style.display =
    'none';


  const content =
    document.getElementById(
      'content'
    );


  content.style.display =
    'block';


  content.innerHTML =

    '<div class="invalid-box">' +

      '<div ' +
        'class="status-icon" ' +
        'style="background:#e59b27;">' +
        '!' +
      '</div>' +

      '<h2 style="color:#b47712;">' +
        'VERIFICATION DELAYED' +
      '</h2>' +

      '<p>' +
        'The verification server could not be reached right now.' +
      '</p>' +

      '<p style="font-size:12px;color:#777;">' +
        'Please try again in a few seconds.' +
      '</p>' +

    '</div>';

}


  /* ==========================================================
     DISPLAY VERIFIED DOG
  ========================================================== */

  function showVerification(result) {

    document
      .getElementById('loading')
      .style.display =
      'none';


    const content =
      document.getElementById(
        'content'
      );


    content.style.display =
      'block';


    if (
      !result ||
      !result.verified
    ) {

      showInvalid(
        result &&
        result.message
          ?
          result.message
          :
          'Dog record not found.'
      );

      return;

    }


    const dog =
      result.dog || {};


    const owner =
      result.owner || {};


    let photoHtml = '';


    if (dog.photoUrl) {

      photoHtml =

        '<img ' +

          'class="dog-photo" ' +

          'src="' +

          escapeHtml(
            dog.photoUrl
          ) +

          '" ' +

          'alt="Dog Photo"' +

        '>';

    }


    content.innerHTML =

      '<div class="status verified">' +

        '<div class="status-icon">✓</div>' +

        '<h2>VERIFIED</h2>' +

        '<div class="valid-badge">' +

          'VALID DOG REGISTRATION' +

        '</div>' +

      '</div>' +


      photoHtml +


      '<div class="owner-summary">' +

        detailRow(
          'Owner',
          owner.maskedName
        ) +

        detailRow(
          'Registered Dogs',
          formatDogCount(
            owner.registeredDogCount
          )
        ) +

        detailRow(
          'Puppies Reported',
          formatPuppyCount(
            owner.puppyCount
          )
        ) +

      '</div>' +


      '<div class="registry-number">' +

        escapeHtml(
          dog.registryNumber || ''
        ) +

      '</div>' +


      '<div class="details">' +

        detailRow(
          'Dog Name',
          dog.dogName
        ) +

        detailRow(
          'Breed',
          dog.breed
        ) +

        detailRow(
          'Color',
          dog.color
        ) +

        detailRow(
          'Registration Status',
          dog.registrationStatus
        ) +

        detailRow(
          'Vaccination Status',
          dog.vaccinationStatus
        ) +

        detailRow(
          'Last Vaccination',
          dog.lastVaccinationDate
        ) +

        detailRow(
          'Next Vaccination',
          dog.nextVaccinationDate
        ) +

      '</div>';

  }


  /* ==========================================================
     DETAIL ROW
  ========================================================== */

  function detailRow(
    label,
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ''
    ) {

      value = '—';

    }


    return (

      '<div class="row">' +

        '<div class="label">' +

          escapeHtml(label) +

        '</div>' +

        '<div class="value">' +

          escapeHtml(
            String(value)
          ) +

        '</div>' +

      '</div>'

    );

  }


  /* ==========================================================
     DOG COUNT
  ========================================================== */

  function formatDogCount(count) {

    count =
      Number(count || 0);


    if (count === 1) {

      return '1 Dog';

    }


    return count + ' Dogs';

  }


  /* ==========================================================
     PUPPY COUNT
  ========================================================== */

  function formatPuppyCount(count) {

    count =
      Number(count || 0);


    if (count === 0) {

      return 'None';

    }


    if (count === 1) {

      return '1 Puppy';

    }


    return count + ' Puppies';

  }


  /* ==========================================================
     INVALID
  ========================================================== */

  function showInvalid(message) {

    document
      .getElementById('loading')
      .style.display =
      'none';


    const content =
      document.getElementById(
        'content'
      );


    content.style.display =
      'block';


    content.innerHTML =

      '<div class="invalid-box">' +

        '<div class="status-icon invalid">' +

          '✕' +

        '</div>' +

        '<h2 class="invalid">' +

          'UNVERIFIED' +

        '</h2>' +

        '<p>' +

          escapeHtml(message) +

        '</p>' +

        '<p style="font-size:12px;">' +

          'Please contact the Barangay Rabies Control Committee ' +

          'for verification assistance.' +

        '</p>' +

      '</div>';

  }


  /* ==========================================================
     ESCAPE HTML
  ========================================================== */

  function escapeHtml(value) {

    const div =
      document.createElement('div');


    div.textContent =
      value || '';


    return div.innerHTML;

  }


  /* ==========================================================
     START
  ========================================================== */

  window.addEventListener(
    'load',
    loadVerification
  );

</script>


</body>

</html>
